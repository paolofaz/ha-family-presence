name: RC2 manual installation package
on:
  push:
    branches:
      - release/0.1.0rc2
    paths:
      - .github/workflows/rc2-manual-install-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.0rc2
      - name: Build tested, version-pinned Home Assistant installation ZIP
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          path = Path("custom_components/family_presence")
          manifest = json.loads((path / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["version"] == "0.1.0rc2"
          assert manifest["domain"] == "family_presence"
          assert (path / "__init__.py").is_file()
          assert (path / "config_flow.py").is_file()
          output = Path("family_presence-v0.1.0rc2-manual.zip")
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for filename in sorted(path.rglob("*")):
                  if filename.is_file() and "__pycache__" not in filename.parts:
                      archive.write(filename, filename.relative_to(path.parent).as_posix())
          with ZipFile(output) as archive:
              names = set(archive.namelist())
              assert "family_presence/manifest.json" in names
              assert "family_presence/__init__.py" in names
              assert json.loads(archive.read("family_presence/manifest.json"))["version"] == "0.1.0rc2"
              print(f"Validated manual ZIP: {len(names)} integration files")
          PY
      - name: Attach manual ZIP to existing v0.1.0rc2 GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.0rc2 family_presence-v0.1.0rc2-manual.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
